project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"

filters:
- nceas-learning-hub/theme
- quarto-ext/fontawesome
exercises: ### for custom theme callouts
  number: true ### see https://cambiotraining.github.io/quarto-course-template/materials/02-content_guidelines.html
editor: source
execute:
  freeze: auto

format:
  theme-html:
    code-annotations: hover       ### tool tip style footnotes for code
    link-external-newwindow: true ### sets {target = "_blank"} for external links
    link-external-icon: true      ### adds icon to external links

website:
  title: "Learning Hub Course Development Packages"
  reader-mode: false
  repo-url: https://github.com/nceas-learning-hub/lh_packages

  ### learning hub logo on browser tab
  favicon: _extensions/nceas-learning-hub/theme/banner/logo_lh_hex.png

  bread-crumbs: false
  navbar:
    right:
      - text: "Instructors"
        menu:
          - text: "Casey O'Hara"
            href: https://www.oharascience.com/
      - icon: github
        href: https://github.com/nceas-learning-hub/lh_packages
        aria-label: GitHub

  sidebar:
    title: "Course Development Resources"
    style: "floating"
    search: true
    tools:
      - icon: house-door-fill
        href: https://www.nceas.ucsb.edu/learning-hub
      - icon: twitter
        href: https://twitter.com/ucsb_nceas
      - icon: github
        href: https://github.com/nceas-learning-hub/lh_packages
    contents:
      - index.qmd # preface
      # START SESSIONS
      - section: "Building a course"
        contents:
        - 1_init_course.qmd
        - 2_setup_lessons.qmd
        - 3_publish_course.qmd
      - section: "Customizing a course"
        contents:
        - 4_modify_lessons.qmd
        - 5_update_lessons.qmd
        - 6_compare_changes_and_checkin.qmd
      - section: "Contributing lessons"
        contents:
        - 7_structure_guide.qmd
        - 8_content_guide.qmd
        - 9_style_guide.qmd
      - lesson_catalog.qmd
      # END SESSIONS

  page-footer:
    center: "Copyright \u00a9 2026, NCEAS"
    ### NCEAS main website footer:
    # center: "\u00a9 The Regents of the University of California, All Rights Reserved"
    # could also include license info?


